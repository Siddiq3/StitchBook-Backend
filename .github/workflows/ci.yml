name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: stitchbook_test_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/stitchbook_test_ci
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Parse authentication changes
        run: |
          node --check src/services/auth.service.js
          node --check src/controllers/auth.controller.js
          node --check src/routes/auth.routes.js
          node --check src/models/user.model.js
          node --check tests/password-auth.test.js
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm audit --omit=dev
